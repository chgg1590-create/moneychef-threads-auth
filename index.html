<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MoneyChef Threads OAuth</title></head><body style="max-width:650px;margin:70px auto;font-family:sans-serif;padding:20px"><h2>Threads 인증 후 돌아가기</h2><p>이 페이지의 주소(URL) 전체를 복사하여 MoneyChef SNS Manager의 '인증 결과 URL'에 붙여넣으세요.</p><button id="copy" style="padding:12px">콜백 URL 복사</button><p id="status"></p><script>document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>document.querySelector('#status').textContent='복사했습니다. 앱에 붙여넣으세요.').catch(()=>document.querySelector('#status').textContent='주소창에서 URL을 직접 복사하세요.');</script></body></html>
