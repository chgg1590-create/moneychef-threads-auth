<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MoneyChef LinkedIn 인증</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;max-width:700px;margin:11vh auto;padding:20px;color:#213047}div{background:#f2f6fb;padding:22px;border-radius:12px}button{background:#0a66c2;color:white;border:0;border-radius:6px;padding:13px 18px;cursor:pointer}small{color:#53657e}</style></head><body><div><h2>LinkedIn 인증 후 돌아가기</h2><p>브라우저 주소창에 표시된 <b>전체 URL</b>을 복사하여 MoneyChef SNS Manager의 <b>LinkedIn 연결</b> 화면에 붙여넣으세요.</p><p><button id="copy">인증 URL 복사</button></p><p id="status"></p><small>이 URL에는 일회용 인증 코드가 포함됩니다. 채팅, 이메일, 다른 사람에게 공유하지 마세요. 앱에만 입력하세요.</small></div><script>document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='복사했습니다. 이제 Windows 앱에 붙여넣으세요.'}catch(e){document.getElementById('status').textContent='브라우저 주소창의 URL을 직접 복사하세요.'}}; if(new URLSearchParams(location.search).has('error')) document.getElementById('status').textContent='인증을 취소했거나 LinkedIn에서 오류가 발생했습니다.';</script></body></html>
